<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AuthStack | Login</title>
    <link rel="shortcut icon" href="{% static 'icon.png' %}" type="image/*">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">
                <img src="{% static 'icon.png' %}" alt="AuthStack Logo">
            </div>
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your account</p>

            <form class="auth-form" action="/" method="post">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required placeholder="hello@authstack.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">
                    <img src="{% static 'finger.gif' %}" alt="Login" class="btn-icon">
                    <span>Log in</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup">Sign up</a></p>
            </div>
        </div>
    </div>
</body>

</html>
